services:
  - type: web
    name: wildfire-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATA_SOURCE
        value: synthetic
      - key: SYNTHETIC_SEED
        value: "42"
      - key: SYNTHETIC_DAYS
        value: "30"
      - key: ALLOWED_ORIGINS
        value: "*"
